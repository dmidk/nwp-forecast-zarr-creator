services:
  app:
    platform: ${DEV_CONTAINER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile
    # The image ENTRYPOINT runs the app; clear it so `command` isn't appended
    # to it as arguments (needed outside the VS Code dev container).
    entrypoint: []
    command: sleep infinity
    working_dir: /app
    volumes:
      - .:/app
      - ./data/harmonie/ml:/mnt/harmonie-data-from-pds/ml
      - ./tmp:/tmp
    environment:
      SRC_GRIB_TEMP_PATH: ""
      # Local input (bind-mounted above); set to s3://bucket/prefix to read
      # from object storage instead (profile from ~/.aws via AWS_PROFILE).
      SRC_GRIB_ROOT_URI: "/mnt/harmonie-data-from-pds/ml"
      # Local zarr output; override with an s3://... format string to write
      # elsewhere, e.g. s3://bucket/{suite_name}/{member}/{t_analysis}/{dataset_id}.zarr
      DST_ZARR_OUTPUT_PATH: "file:///tmp/nwp-zarr-output/{suite_name}-recent/{dataset_id}.zarr"
      # AWS_PROFILE: "my-profile"
